version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR....
      # checking version
      - aws --version

      # Login to Amazon ECR
            - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 784827856270.dkr.ecr.us-east-1.amazonaws.com

      # ECR Repository URI
      - REPOSITORY_URI=784827856270.dkr.ecr.us-east-1.amazonaws.com/spring-demo-ecr

      # Create unique image tag
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')

  build:
    commands:
      - echo Build started on `date`
      - echo building the Jar file
      - mvn clean install

      - echo Building the Docker image...
      - docker build -t $REPOSITORY_URI:latest .

      - echo Tagging Docker image...
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Build completed on `date`

      - echo Pushing Docker image to Amazon ECR...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - echo Writing image definitions file...

      # Container name - keep this same for ECS
      - DOCKER_CONTAINER_NAME=spring-demo-ecr

      - printf '[{"name":"%s","imageUri":"%s"}]' $DOCKER_CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

      - echo $DOCKER_CONTAINER_NAME
      - echo printing imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - target/springboot-aws-deploy.jar
